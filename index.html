<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <html lang='pt-BR'>

  <title>Alto Nível</title>

</head>

<body class="h-screen bg-black">
  
  <header>
    
  </header>


  <main class="flex flex-col justify-around h-full w-80%  bg-neutral-900">
    
     <div class="flex justify-center w-full">


 <section class="flex flex-col w-1/3  text-yellow-100"> <h1><B>Dados do cliente e Veículo</B></h1>
 <div>
 <label for="cliente">Cliente:</label>
 <input type="
 text"  id="cliente" placeholder="digite o nome do cliente"/>
 </div>
 <div>
 <label for="telefone">Telefone:</label>
 <input type="
 text"  id="telefone" placeholder="(00) 00000-0000"/>
 </div>
 <div>
 <label for="cpf">CPF/CNPJ:</label>
 <input type="
 text"  id="cpf" placeholder="000-000-000/00"/>
 </div>
 <div>
 <label for="email">E-mail:</label>
 <input type="
 text"  id="email" placeholder="exemplo@gmail.com"/>
 
</div>


<div>

  <label for="veiculo">Veiculo:</label>
 <input type="
 text"  id="veiculo" placeholder="modelo do veículo"/>


</div>
<div>
    <label for="cor">Cor:</label>
 <input type="
 text"  id="cor" placeholder="Cor do veículo"/>
 </div>
 <div>
  <label for="placa">Placa:</label>
 <input type="
 text"  id="placa" placeholder="000-0000"/>
</div>
 <div>
 <label for="ano">Ano:</label>
 <input type="
 text"  id="ano" placeholder="2025"/>
 </div>

  


 

 </section>
 </div>
  <!-- Relato do cleinte  e sintomas -->


 <div class="flex w-full justify-around ">
  <section class="bg-black rounded-2xl  w-100 text-yellow-100"> 
    <div class="bg-yellow-300 w-full text-black rounded-t-2xl p-2">
  <h1><b>Relato do Cliente e sintomas:</b></h1>
  </div>
<div class="flex flex-col justify-around">
  
<div>
      <label for="luz">Luz de injeção acesa</label>
      <input type="checkbox" id="luz"/>
</div>


<div>
   <label for="partida">Falha na partida</label>
  <input type="checkbox" id="partida"/> 
</div>
<div>
   <label for="marcha">Marcha lenta irregular</label>
  <input type="checkbox" id="marcha"/> 
</div>
<div>
   <label for="potência">Falta de potência</label>
  <input type="checkbox" id="potência"/> 
</div>
<div>
   <label for="consumo">Consumo  alto</label>
  <input type="checkbox" id="consumo"/> 
  <div>
   <label for="motor">Motor morrendo </label>
 <input type="checkbox"  id="motor"/>
</div>
</div>
   
  
  
  <label for="obs">Observações:</label>
  <textarea  id= "obs" rows="5" cols="20" placeholder="digite aqui a observação"></textarea>
  </div>
  </section>
  
 
 <section class="bg-black rounded-2xl  text-yellow-100">
  <div class="bg-yellow-300 w-full text-black rounded-t-2xl p-2">
 <h1><b>
  Checklist Injeção Eletrônica:
  </b>
  </div>
 </h1>
 <label for="scanner">Scanner (Código de falha):</label>
 <input type="text" id="scanner" placeholder="digite o código descrito no scanner">

 
 <ul>
    <p>Pressão de Combustível:</p>
   <li>
     <label for="baixa">Baixa</label>
     <input type="text" id="baixa" list="listaCheckList">
   </li>
    <li>
     <label for="alta">Alta</label>
     <input type="text" id="alta" list="listaCheckList">
   </li>
   
   
   <li>
     <label for="bico">Vazão dos Eletroinjetores</label>
     <input type="text" id="bico" list="listaCheckList">
   </li>
   <li>
     <label for="corpo">Corpo de borboleta (TBI-limpeza)</label>
     <input type="text" id="corpo" list="listaCheckList">
   </li>
      <li>
     <label for="cabo">Cabos de vela/bobina</label>
     <input type="text" id="cabo" list="listBobina">
   </li>
   <li>
     <label for="vela">Velas de ignição</label>
     <input type="text" id="vela" list="listBobina">
   </li>
   <li>
     <label for="sensor">Sensores (MAP/MAF/TPS/Sonda</label>
     <input type="text" id="sensor" list="listBobina">
   </li>
   <li>
     <label for="bateria">Bateria/Alternador (Tensão)</label>
     <input type="text" id="bateria" list="listBateria">
   </li>
   
<li>
  
   <p>Avaria:</p>

 <div class="flex">

  <div class="mr-5">
     <input type="radio"  id="sim" placeholder=""/>
    <label for="sim">Sim</label>
  </div>


  <div>
     <input type="radio"  id="nao" placeholder=""/>
    <label for="nao">Não</label>
  </div>

</div>
</li>

 </ul>
 <datalist id="listaCheckList">
 <option value="Bom">
 <option value="Ruim">
<option value="Ajustar">
  

 </datalist>
 
   <datalist id="listBobina">
    <option value="Bom">
      <option value="Ruim">
  </datalist>


 </datalist>
 
   <datalist id="listBateria">
    <option value="Boa">
    <option value="Ruim">
   <option value="Carregar antes do teste">

  </datalist>
 </section>
  </div>
  </div>
  
    <div class="w-full">
      <ul id="ulList" class="w-full">
        <li>
          <div class="flex justify-between mx-2">
          
        <div class="w-1/10 bg-green-100"><b>Quantidade</b></div>
          <div><b>Descrição da peça /serviço</b></div>
          <div class="w-1/10 bg-green-100"> <b>Valor unitário</b></div>
          <div class="w-1/10"><b>Total</b></div>
         
        
        </div>
        </li>

              

      </ul>
     <div class="flex justify-between mx-2">
          
        <div><input type="number" placeholder="0" id="tableQnt"></div>
          <div><input type="text" placeholder="Descrição de serviço prestado" id="tableDesc" class="flex flex-wrap"></div>
         
          <div><input type="number" id="tableValUni" placeholder="R$ 00,00">
          </div>
          <div>
            <input type="number" id="tableTot" placeholder="R$ 00,00">
          </div>
         
        
        </div>

      
      <button class="bg-pink-500" id="adicionar">adicionar</button>
    </div>
