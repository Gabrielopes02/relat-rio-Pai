<!doctype html>
<html>
  <html lang="pt-BR">
    <head>
      <meta charset="UTF-8" />

      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Alto Nível</title>
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>

    <body class="h-screen bg-black flex justify-center items-center flex-col print:text-black print:bg-white">
      <header></header>

      <main
        class="flex flex-col justify-around h-9/10 w-9/10 absolute bg-gray-800 border border-yellow-300 rounded-2xl print:border-none">
        <div
          class="flex justify-center self-center relative -top-10 bg-gradient-to-r from-yellow-500 via-yellow-100 to-yellow-500 w-60 rounded-xl p-1">
          <h1><b>Dados do cliente e Veículo</b></h1>
        </div>
        <div class="flex justify-center w-full">
          <section class="flex flex-col w-1/3 text-yellow-300">
            <div>
              <label for="cliente">Cliente:</label>
              <input
                type="text"
                id="cliente"
                placeholder="digite o nome do cliente" />
            </div>
            <div>
              <label for="telefone">Telefone:</label>
              <input type="text" id="telefone" placeholder="(00) 00000-0000" />
            </div>
            <div>
              <label for="cpf">CPF/CNPJ:</label>
              <input type="text" id="cpf" placeholder="000-000-000/00" />
            </div>
            <div>
              <label for="email">E-mail:</label>
              <input type="text" id="email" placeholder="exemplo@gmail.com" />
            </div>

            <div>
              <label for="veiculo">Veiculo:</label>
              <input type="text" id="veiculo" placeholder="modelo do veículo" />
            </div>
            <div>
              <label for="cor">Cor:</label>
              <input type="text" id="cor" placeholder="Cor do veículo" />
            </div>
            <div>
              <label for="placa">Placa:</label>
              <input type="text" id="placa" placeholder="000-0000" />
            </div>
            <div>
              <label for="ano">Ano:</label>
              <input type="text" id="ano" placeholder="2025" />
            </div>
          </section>
        </div>
        <!-- Relato do cleinte  e sintomas -->

        <div class="flex w-full justify-around">
          <section class="bg-black rounded-2xl w-100 text-yellow-100">
            <div
              class="bg-gradient-to-r from-yellow-500 via-yellow-100 to-yellow-500 w-full text-black rounded-t-2xl p-2 flex justify-center">
              <h1><b>Relato do Cliente e sintomas:</b></h1>
            </div>
            <div class="flex flex-col justify-center items-center">
              <div class="">
                <label for="luz">Luz de injeção acesa</label>
                <input type="checkbox" id="luz" />
              </div>
              <div class="">
                <label for="partida">Falha na partida</label>
                <input type="checkbox" id="partida" />
              </div>
              <div>
                <label for="marcha">Marcha lenta irregular</label>
                <input type="checkbox" id="marcha" />
              </div>
              <div>
                <label for="potência">Falta de potência</label>
                <input type="checkbox" id="potência" />
              </div>
              <div>
                <label for="consumo">Consumo alto</label>
                <input type="checkbox" id="consumo" />
                <div>
                  <label for="motor">Motor morrendo </label>
                  <input type="checkbox" id="motor" />
                </div>
              </div>

              <label for="obs">Observações:</label>
              <textarea
                id="obs"
                rows="5"
                cols="20"
                placeholder="digite aqui a observação"
                class="w-full text"></textarea>
            </div>
          </section>

          <section class="bg-black rounded-2xl text-yellow-100">
            <div
              class="bg-gradient-to-r from-yellow-500 via-yellow-100 to-yellow-500 w-full text-black rounded-t-2xl p-2 flex justify-center">
              <h1><b> Checklist Injeção Eletrônica: </b></h1>
            </div>



            <div class="flex flex-col justify-center items-center">
              <label for="scanner">Scanner (Código de falha):</label>
              <input
                type="text"
                id="scanner"
                placeholder="digite o código descrito no scanner" />
              <ul class="text-center">
                <p>Pressão de Combustível:</p>
                <li>
                  <label for="baixa">Baixa</label>
                  <input type="text" id="baixa" list="listaCheckList" />
                </li>
                <li>
                  <label for="alta">Alta</label>
                  <input type="text" id="alta" list="listaCheckList" />
                </li>
                <li>
                  <label for="bico">Vazão dos Eletroinjetores</label>
                  <input type="text" id="bico" list="listaCheckList" />
                </li>
                <li>
                  <label for="corpo">Corpo de borboleta (TBI-limpeza)</label>
                  <input type="text" id="corpo" list="listaCheckList" />
                </li>
                <li>
                  <label for="cabo">Cabos de vela/bobina</label>
                  <input type="text" id="cabo" list="listBobina" />
                </li>
                <li>
                  <label for="vela">Velas de ignição</label>
                  <input type="text" id="vela" list="listBobina" />
                </li>
                <li>
                  <label for="sensor">Sensores (MAP/MAF/TPS/Sonda</label>
                  <input type="text" id="sensor" list="listBobina" />
                </li>
                <li>
                  <label for="bateria">Bateria/Alternador (Tensão)</label>
                  <input type="text" id="bateria" list="listBateria" />
                </li>
                <li>
                  <p>Avaria:</p>
                  <div class="flex justify-center">
                    <div class="mr-5">
                      <input name="avaria" type="radio" id="sim" placeholder="" />
                      <label for="sim">Sim</label>
                    </div>
                    <div class="flex justify-center">
                      <input  name="avaria" type="radio" id="nao" placeholder="" />
                      <label for="nao">Não</label>
                    </div>
                  </div>
                </li>
              </ul>
            </div>
            <datalist id="listaCheckList">
              <option value="Bom"></option>
              <option value="Ruim"></option>
              <option value="Ajustar"></option>
            </datalist>

            <datalist id="listBobina">
              <option value="Bom"></option>
              <option value="Ruim"></option>
            </datalist>

            <datalist id="listBateria">
              <option value="Boa"></option>
              <option value="Ruim"></option>
              <option value="Carregar antes do teste"></option>
            </datalist>
          </section>
        </div>

        <!-- TABELA DE SERVICOS -->
        <div class="w-full text-yellow-300">
          <ul id="ulList" class="w-full">
            <li>
              <div class="flex justify-between">
                <div class="w-1/10 flex justify-center">
                  <p><b>Quantidade</b></p>
                </div>
                <div class="w-7/10 flex justify-center flex-wrap">
                  <b>Descrição da peça /serviço</b>
                </div>
                <div class="w-1/10 flex justify-center items-center">
                  <p><b>Valor unitário</b></p>
                </div>
                <div class="w-1/10 flex justify-center items-center">
                  <b>Total</b>
                </div>
              </div>
            </li>
          </ul>

          <!-- INPUT DE VALORES DA TABELA -->
          <div
            class="flex w-full border-y border-t-yellow-300 border-b-yellow-100">
            <div class="w-1/10 text-center">
              <input
                type="number"
                placeholder="0"
                id="tableQnt"
                class="w-full [&::-webkit-inner-spin-button]:appearance-none focus:outline-none" />
            </div>
            <div class="w-7/10 flex justify-center">
              <input
                type="text"
                placeholder="Descrição de serviço prestado"
                id="tableDesc"
                class="flex flex-wrap w-full text-center focus:outline-none" />
            </div>

            <div class="w-1/10 text-center">
              <input
                class="w-full focus:outline-none [&::-webkit-inner-spin-button]:appearance-none"
                type="number"
                id="tableValUni"
                placeholder="R$00,00" />
            </div>
            <div class="w-1/10">
              <input
                class="w-full [&::-webkit-inner-spin-button]:appearance-none focus:outline-none"
                type="number"
                id="tableTot"
                placeholder="R$ 00,00" />
            </div>
          </div>

          <div class="flex justify-between mt-2 px-2">
            <button class=" print:hidden border rounded p-1 hover:bg-gray-600" id="adicionar">
              adicionar
            </button>
            <button class="border rounded p-1 hover:bg-gray-600 print:hidden" id="saveInPdf">
              Salvar ou imprimir em PDF
            </button>
          </div>
        </div>
      </main>

      <footer>
        <p class="text-white">
          assinatura do cliente volta Redonda__ de ___________ de ______
        </p>
      </footer>
      <script src="app.js"></script>
    </body>
  </html>
</html>
