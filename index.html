<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alto Nível</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />
  </head>

  <body
    class="h-min-screen bg-black flex justify-center items-center flex-col print:text-black print:bg-white p-10 print:text-black">
    <header></header>

    <main
      class="flex flex-col items-center justify-around absolute bg-gray-800 border border-yellow-300 rounded-2xl print:border-none relative m-15 w-full min-h-full print:max-h-screen">
      <div
        class="absolute -top-5 bg-gradient-to-r from-yellow-400 via-yellow-100 to-yellow-400 text-black px-5 p-2 flex justify-center no-wrap rounded rounded-tl-xl rounded-br-xl shadow-lg shadow-white">
        <h1><b>Dados do Cliente e Veículo</b></h1>
      </div>

      <!-- Dados do cliente e veiculo -->
      <div class="flex justify-center w-full mt-10">
        <section
          class="flex justify-around text-yellow-300 gap-2 mb-10 w-full print:text-black">
          <div class="flex flex-col gap-2">
            <div class="flex no-wrap gap-2 rounded-xl px-2 bg-gray-700">
              <label for="cliente">Cliente:</label>
              <input
                type="text"
                id="cliente"
                placeholder="digite o nome do cliente" />
            </div>
            <div class="flex no-wrap gap-2 bg-gray-700 rounded-xl px-2">
              <label for="telefone">Telefone:</label>
              <input type="text" id="telefone" placeholder="(00) 00000-0000" />
            </div>
            <div class="flex no-wrap gap-2 bg-gray-700 rounded-xl px-2">
              <label for="cpf">CPF/CNPJ:</label>
              <input type="text" id="cpf" placeholder="000-000-000/00" />
            </div>
            <div class="flex no-wrap gap-2 bg-gray-700 rounded-xl px-2">
              <label for="email">E-mail:</label>
              <input type="text" id="email" placeholder="exemplo@gmail.com" />
            </div>
          </div>
          <div class="flex flex-col gap-2">
            <div class="flex no-wrap gap-2 bg-gray-700 rounded-xl px-2">
              <label for="veiculo">Veiculo:</label>
              <input type="text" id="veiculo" placeholder="modelo do veículo" />
            </div>
            <div class="flex no-wrap gap-2 bg-gray-700 rounded-xl px-2">
              <label for="cor">Cor:</label>
              <input type="text" id="cor" placeholder="Cor do veículo" />
            </div>
            <div class="flex no-wrap gap-2 bg-gray-700 rounded-xl px-2">
              <label for="placa">Placa:</label>
              <input type="text" id="placa" placeholder="000-0000" />
            </div>
            <div class="flex no-wrap gap-2 bg-gray-700 rounded-xl px-2">
              <label for="ano">Ano:</label>
              <input type="text" id="ano" placeholder="2025" />
            </div>
          </div>
        </section>
      </div>

      <!-- Relato do cleinte  e sintomas -->

      <div
        class="flex w-full text-yellow-400 gap-2 m-5 justify-around print:text-black">
        <!-- column 1 -->
        <section
          class="bg-black rounded-2xl relative flex justify-center min-w-100">
          <div
            class="absolute -top-5 bg-gradient-to-r from-yellow-400 via-yellow-100 to-yellow-400 text-black p-2 flex justify-center no-wrap rounded rounded-tl-xl rounded-br-xl shadow-lg shadow-white">
            <h1><b>Relato do Cliente e sintomas</b></h1>
          </div>
          <div
            class="flex flex-col justify-center items-center m-5 mt-10 gap-2 w-full">
            <div
              class="flex no-wrap gap-2 border-2 border-gray-700 rounded-xl p-2 w-full justify-between">
              <label for="luz">Luz de injeção acesa</label>
              <input type="checkbox" id="luz" />
            </div>
            <div
              class="flex no-wrap gap-2 border-2 border-gray-700 rounded-xl p-2 w-full justify-between">
              <label for="partida">Falha na partida</label>
              <input type="checkbox" id="partida" />
            </div>
            <div
              class="flex no-wrap gap-2 border-2 border-gray-700 rounded-xl p-2 w-full justify-between">
              <label for="marcha">Marcha lenta irregular</label>
              <input type="checkbox" id="marcha" />
            </div>
            <div
              class="flex no-wrap gap-2 border-2 border-gray-700 rounded-xl p-2 w-full justify-between">
              <label for="potência">Falta de potência</label>
              <input type="checkbox" id="potência" />
            </div>
            <div
              class="flex no-wrap gap-2 border-2 border-gray-700 rounded-xl p-2 w-full justify-between">
              <label for="consumo">Consumo alto</label>
              <input type="checkbox" id="consumo" />
            </div>
            <div
              class="flex no-wrap gap-2 border-2 border-gray-700 rounded-xl p-2 w-full justify-between">
              <label for="motor">Motor morrendo </label>
              <input type="checkbox" id="motor" />
            </div>
            <div
              class="border border-gray-700 rounded-2xl px-2 mt-2 w-full flex flex-col">
              <label class="text-center" for="obs">Observações</label>
              <textarea
                id="obs"
                rows="5"
                cols="20"
                placeholder="digite aqui a observação."
                class="outline-none text-justify"></textarea>
            </div>
          </div>
        </section>

        <!-- column 2 -->

        <section class="relative flex justify-center bg-black rounded-2xl">
          <div
            class="absolute -top-5 bg-gradient-to-r from-yellow-400 via-yellow-50 to-yellow-400 text-black rounded rounded-tl-2xl rounded-br-2xl p-2 flex justify-center shadow-lg shadow-white">
            <h1><b> Checklist Injeção Eletrônica </b></h1>
          </div>

          <div class="mt-10 flex flex-col gap-2">
            <div class="border-2 border-gray-700 p-2 rounded-xl mx-2">
              <label for="scanner"
                >Scanner (Código de falha):
                <input
                  class="w-50"
                  type="text"
                  id="scanner"
                  placeholder="Código do scanner." />
              </label>
            </div>

            <div
              class="flex flex-col border-2 border-gray-700 p-2 rounded-xl gap-2 mx-2 items-center">
              <p class="text-center whitespace-nowrap">
                Pressão de Combustível
              </p>

              <div class="flex w-full items-center justify-center">
                <div class="flex no-wrap justify-center items-center gap-2">
                  <label for="baixa">Baixa:</label>
                  <input
                    class="w-20"
                    type="text"
                    id="baixaBar"
                    list=""
                    placeholder="Bar" />

                  <input
                    class="w-20"
                    type="text"
                    id="baixaMPa"
                    list=""
                    placeholder="KPa" />
                </div>

                <div class="flex no-wrap gap-2">
                  <label for="alta">Alta:</label>
                  <input
                    type="text"
                    id="altaBar"
                    class="w-20"
                    placeholder="Bar" />
                  <input
                    type="text"
                    id="altaKPa"
                    class="w-20"
                    placeholder="KPa" />
                </div>
              </div>
            </div>

            <div class="p-2 mx-2 rounded-xl border-2 border-gray-700">
              <label for="bico">Vazão dos Eletroinjetores:</label>
              <input
                type="text"
                id="bico"
                list="listCheckList"
                placeholder="Selecione" />
            </div>

            <div
              class="p-2 mx-2 rounded-xl border-2 border-gray-700 flex gap-2">
              <label class="whitespace-nowrap" for="corpo"
                >Corpo de borboleta (TBI-limpeza):</label
              >
              <input
                type="text"
                id="corpo"
                list="listCheckList"
                placeholder="Selecione " />
            </div>

            <div class="p-2 mx-2 rounded-xl border-2 border-gray-700">
              <label for="cabo">Cabos de vela:</label>
              <input
                type="text"
                id="cabo"
                list="listCheckList"
                placeholder="Selecione" />
            </div>

            <div class="p-2 mx-2 rounded-xl border-2 border-gray-700">
              <label for="cabo">Bobina:</label>
              <input
                type="text"
                id="cabo"
                list="listCheckList"
                placeholder="Selecione" />
            </div>

            <div class="p-2 mx-2 rounded-xl border-2 border-gray-700">
              <label for="vela">Velas de ignição:</label>
              <input
                type="text"
                id="vela"
                list="listCheckList"
                placeholder="Selecione" />
            </div>

            <div
              class="border-2 border-gray-700 p-2 mx-2 rounded-xl flex justify-between">
              <div class="text-nowrap mr-2">
                <label for="sensorMafBar">Sensores (MAF/TPS/Sonda):</label>
              </div>
              <div class="flex justify-around w-full">
                <input
                  type="text"
                  id="sensorMafBar"
                  placeholder="mBar"
                  class="w-20" />
                <input
                  type="text"
                  id="sensorMafPa"
                  placeholder="KPa"
                  class="w-20" />
              </div>
            </div>
            <div
              class="border-2 border-gray-700 p-2 mx-2 rounded-xl flex justify-between">
              <div class="text-nowrap mr-2">
                <label for="sensorMafBar">Sensor Map:</label>
              </div>
              <div class="flex justify-around w-full">
                <input
                  type="text"
                  id="sensorMapBar"
                  placeholder="mBar"
                  class="w-20" />
                <input
                  type="text"
                  id="sensorMapPa"
                  placeholder="KPa"
                  class="w-20" />
              </div>
            </div>

            <div class="border-2 border-gray-700 p-2 mx-2 rounded-xl">
              <label for="bateria">Bateria/Alternador (Tensão):</label>
              <input
                type="text"
                id="bateria"
                list="listBateria"
                placeholder="Selecione" />
            </div>

            <div
              class="flex gap-2 items-center justify-center border-2 border-gray-700 mx-2 mb-2 rounded-xl p-2">
              <p>Avaria:</p>

              <div class="flex mr-5 gap-2 items-center">
                <div>
                  <input name="avaria" type="radio" id="sim" />
                  <label for="sim">Sim</label>
                </div>

                <div>
                  <input name="avaria" type="radio" id="sim" />
                  <label for="sim">Não</label>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- tabela de servicos -->

      <div class="w-full p-2">
        <!-- cabecalho -->
        <div class="bg-white w-full"></div>



      </div>









      <!-- div button -->
      <div class="flex justify-between px-5 mb-5 w-full text-yellow-300">
        <button
          class="print:hidden border rounded p-1 hover:bg-gray-600 px-3"
          id="adicionar">
          adicionar
        </button>
        <button
          class="border rounded p-1 hover:bg-gray-600 print:hidden px-3"
          id="saveInPdf">
          Salvar ou imprimir em PDF
        </button>
      </div>
    </main>
    <footer
      class="text-white w-full print:text-black flex flex-col justify-center items-center gap-3 hidden print:block">
      <div class="flex gap-2 justify-center">
        <p>assinatura do cliente:</p>
        <div class="w-100 border-b"></div>
      </div>
      <div class="flex justify-center mt-2 gap-2">
        <p>Volta Redonda,</p>
        <p>____ de ___________ de ______</p>
      </div>
    </footer>

    <datalist id="listCheckList">
      <option value="Bom" />
      <option value="Ruim" />
    </datalist>

    <datalist id="listBateria">
      <option value="Bom" />
      <option value="Ruim" />
      <option value="Descarregada" />
    </datalist>

    <script src="app.js"></script>
  </body>
</html>
